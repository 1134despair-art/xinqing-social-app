普通录音（uni recorder）                          腾讯实时识别（Tencent realtime ASR）

用户点按钮                                       用户点按钮
-> toggleRecording()                             -> toggleRecording()
-> 判断 isRealtimeSpeechAvailable=false          -> 判断 isRealtimeSpeechAvailable=true
-> startUniRecording()                           -> startRealtimeSpeechRecording()
   -> 清空旧状态                                    -> 清空旧状态
   -> voiceRecordStatus=recording                  -> isUsingRealtimeSpeech=true
   -> recorderManager.start()                      -> voiceRecordStatus=recording
                                                     -> buildRealtimeSpeechSaveFilePath()
                                                     -> startTencentRealtimeSpeech(...)
                                                        -> startRealtimeRecognize(...)

录音中                                          录音中
-> 无实时文本回调                                 -> onStartRecord
                                                   -> 页面打印 startRecord
                                                 -> onSliceRecognize
                                                   -> handleRealtimeSpeechSlice()
                                                   -> setVoiceTranscript()
                                                 -> onSegmentRecognize
                                                   -> handleRealtimeSpeechSegment()
                                                   -> appendVoiceTranscript()

用户点结束                                       用户点结束
-> stopRecordingInternal()                       -> stopRecordingInternal()
-> recorderManager.stop()                        -> Android 当前走 cancelTencentRealtimeSpeech()
                                                    + finishRealtimeSpeechByCancel()
                                                  -> 理想路径原本是 stopTencentRealtimeSpeech()

原生结束回调                                     原生结束/取消回调
-> recorderManager.onStop(res)                   -> onStopRecord（理想情况）
   -> 校验 tempFilePath                              -> 页面打印 stopRecord
   -> 校验 duration                               -> onFinish（理想情况）
   -> finishVoiceRecording(...)                      -> handleRealtimeSpeechFinish()
                                                         -> 如果已有音频:
                                                            voiceRecordStatus=ready
                                                         -> 如果只有文字:
                                                            scheduleAudioSaveTimeout()

文件保存                                         音频保存
-> uni.saveFile(tempFilePath)                    -> onAudioSaved
-> applySaved(savedPath)                            -> handleRealtimeSpeechAudioSaved()
   -> recordedAudioPath=savedPath                    -> persistVoiceFile(...)
   -> recordDurationSec=...                          -> finishVoiceRecording(...)
   -> voiceRecordStatus=ready                        -> applySaved(...)
   -> voicePublishMode=voice                            -> recordedAudioPath=savedPath
                                                           -> voiceRecordStatus=ready

自动上传                                         自动上传
-> ensureVoiceUploaded(filePath)                 -> ensureVoiceUploaded(filePath)
   -> uploadVoiceFile(...)                          -> uploadVoiceFile(...)
   -> uploadedVoiceUrl=url                          -> uploadedVoiceUrl=url

最终状态                                         最终状态
-> 有本地音频                                   -> 有实时识别文本
-> 有上传地址                                   -> 理想情况下还有本地音频/上传地址
-> 可试听                                       -> 可试听
-> 可按语音发布                                 -> 可按语音发布
-> 也可转文字发布                               -> 也可转文字发布